<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesorería Iglesia</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <!-- Tailwind, Supabase SDK, Chart.js y SheetJS (Excel) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <!-- PANTALLA LOGIN -->
  <div id="loginView" class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm">
      <div class="text-center mb-6">
        <span class="text-4xl block mb-2">🏛️</span>
        <h1 class="text-xl font-bold text-slate-800">Tesorería Iglesia</h1>
        <p class="text-xs text-slate-500 mt-1">Ingresa tu usuario y contraseña</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Usuario</label>
          <input type="text" id="loginUser" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Contraseña</label>
          <input type="password" id="loginPass" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition text-sm">Entrar</button>
        <p id="loginError" class="text-xs text-red-500 text-center hidden">Usuario o contraseña incorrectos</p>
      </form>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div id="appView" class="hidden pb-20">
    <!-- Header -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 px-4 py-3 shadow">
      <div class="max-w-md mx-auto flex items-center justify-between">
        <div>
          <h1 class="text-base font-bold flex items-center gap-1.5">
            <span>🏛️</span> Tesorería
          </h1>
          <p id="userBadge" class="text-[11px] text-slate-400"></p>
        </div>
        <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">Salir</button>
      </div>

      <!-- Barra de pestañas (SOLO visible para Administrador) -->
      <nav id="adminNav" class="max-w-md mx-auto grid grid-cols-2 gap-2 mt-3 bg-slate-800 p-1 rounded-xl" style="display: none;">
        <button id="tabReportsBtn" onclick="switchTab('reports')" class="py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition">Reportes y Balance</button>
        <button id="tabRegisterBtn" onclick="switchTab('register')" class="py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">Cargar Movimiento</button>
      </nav>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

      <!-- SECCIÓN 1: REPORTES Y BALANCES -->
      <div id="sectionReports" class="space-y-4">
        
        <!-- Tarjetas de Balance -->
        <div class="grid grid-cols-3 gap-2">
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm text-center">
            <span class="text-[10px] uppercase font-bold text-emerald-600 block">Ingresos</span>
            <span id="metricIncome" class="text-sm font-bold text-slate-800">$0</span>
          </div>
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm text-center">
            <span class="text-[10px] uppercase font-bold text-rose-600 block">Egresos</span>
            <span id="metricExpense" class="text-sm font-bold text-slate-800">$0</span>
          </div>
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm text-center">
            <span class="text-[10px] uppercase font-bold text-blue-600 block">Saldo</span>
            <span id="metricBalance" class="text-sm font-bold text-slate-800">$0</span>
          </div>
        </div>

        <!-- 4 Filtros + Botón Exportar a Excel -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">Fecha Inicio</label>
              <input type="date" id="filterStartDate" onchange="loadReports()" class="w-full text-xs px-2 py-2 border rounded-lg">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">Fecha Fin</label>
              <input type="date" id="filterEndDate" onchange="loadReports()" class="w-full text-xs px-2 py-2 border rounded-lg">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">Tipo de Flujo</label>
              <select id="filterFlowType" onchange="onFlowTypeChange()" class="w-full text-xs px-2 py-2 border rounded-lg bg-white">
                <option value="all">Todos</option>
                <option value="income">Ingresos (+)</option>
                <option value="expense">Egresos (-)</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">Motivo / Categoría</label>
              <select id="filterCategory" onchange="loadReports()" class="w-full text-xs px-2 py-2 border rounded-lg bg-white">
                <option value="all">Todos los motivos</option>
              </select>
            </div>
          </div>

          <div class="flex items-center justify-between pt-1 border-t border-slate-100">
            <button onclick="clearFilters()" class="text-[11px] text-blue-600 font-semibold hover:underline">Limpiar filtros</button>
            <button onclick="exportToExcel()" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg shadow-sm transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              Exportar Excel
            </button>
          </div>
        </div>

        <!-- GRÁFICOS REPRESENTATIVOS -->
        <div id="chartsContainer" class="space-y-4">
          <!-- Gráfico 1: Comparativa Ingresos vs Egresos -->
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Proporción de Fondos</h3>
            <div class="h-48 relative">
              <canvas id="chartDonut"></canvas>
            </div>
          </div>

          <!-- Gráfico 2: Desglose por Motivo -->
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Desglose por Motivo ($)</h3>
            <div class="h-56 relative">
              <canvas id="chartCategories"></canvas>
            </div>
          </div>
        </div>

        <!-- Lista Detallada de Movimientos -->
        <div class="space-y-2">
          <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider px-1">Detalle de Movimientos</h2>
          <div id="txList" class="space-y-2"></div>
        </div>

      </div>

      <!-- SECCIÓN 2: CARGAR MOVIMIENTO Y USUARIOS (Solo Admin) -->
      <div id="sectionRegister" class="space-y-4" style="display: none;">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
          <form id="txForm" class="space-y-4">
            
            <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
              <label class="cursor-pointer">
                <input type="radio" name="txType" value="income" checked class="peer sr-only" onchange="updateFormCategories()">
                <div class="py-2.5 text-center text-sm font-semibold rounded-lg peer-checked:bg-emerald-600 peer-checked:text-white text-slate-600 transition">
                  + Ingreso
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="txType" value="expense" class="peer sr-only" onchange="updateFormCategories()">
                <div class="py-2.5 text-center text-sm font-semibold rounded-lg peer-checked:bg-rose-600 peer-checked:text-white text-slate-600 transition">
                  - Egreso
                </div>
              </label>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Monto ($)</label>
              <input type="number" id="txAmount" step="any" inputmode="decimal" required placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-2xl font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="text-xs font-semibold text-slate-500">Motivo</label>
                <button type="button" onclick="promptNewCategory()" class="text-xs text-blue-600 font-semibold hover:underline">+ Crear motivo</button>
              </div>
              <select id="txCategory" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-white font-medium text-slate-700 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Descripción / Observación (Opcional)</label>
              <input type="text" id="txDesc" placeholder="Ej: Culto dominical, pago servicios..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button type="submit" id="saveTxBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl shadow transition text-sm">
              Guardar Movimiento
            </button>
          </form>
        </div>

        <!-- ABM DE USUARIOS (Solo Admin) -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
          <h2 class="text-sm font-bold text-slate-800 border-b pb-2">Gestión de Usuarios</h2>
          <form id="userForm" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Nuevo Usuario</label>
              <input type="text" id="newUsername" required placeholder="ej: secretaria, colaborador" class="w-full px-3 py-2 rounded-lg border text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Contraseña</label>
              <input type="text" id="newPassword" required placeholder="clave simple" class="w-full px-3 py-2 rounded-lg border text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Rol</label>
              <select id="newRole" class="w-full px-3 py-2 rounded-lg border bg-white text-sm">
                <option value="user">Usuario (Solo reportes)</option>
                <option value="admin">Administrador (Carga + Usuarios)</option>
              </select>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg text-xs transition">
              Crear Usuario
            </button>
          </form>

          <div class="space-y-1.5 pt-2">
            <h3 class="text-xs font-bold text-slate-400 uppercase">Usuarios Actuales</h3>
            <div id="usersList" class="space-y-1 text-xs"></div>
          </div>
        </div>

      </div>

    </main>
  </div>

  <!-- MODAL EDITAR MOVIMIENTO -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-4">
      <h3 class="text-sm font-bold text-slate-800 border-b pb-2">Editar Movimiento</h3>
      <form id="editForm" class="space-y-3">
        <input type="hidden" id="editId">
        
        <div>
          <label class="block text-[11px] font-semibold text-slate-500 mb-1">Tipo de Flujo</label>
          <select id="editType" onchange="updateEditCategories()" class="w-full text-xs px-2.5 py-2 border rounded-lg bg-white">
            <option value="income">Ingreso (+)</option>
            <option value="expense">Egreso (-)</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-500 mb-1">Monto ($)</label>
          <input type="number" id="editAmount" step="any" required class="w-full text-sm font-bold px-3 py-2 border rounded-lg">
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-500 mb-1">Motivo</label>
          <select id="editCategory" required class="w-full text-xs px-2.5 py-2 border rounded-lg bg-white"></select>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-500 mb-1">Fecha</label>
          <input type="date" id="editDate" required class="w-full text-xs px-2.5 py-2 border rounded-lg">
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-500 mb-1">Descripción</label>
          <input type="text" id="editDesc" class="w-full text-xs px-3 py-2 border rounded-lg">
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
          <button type="button" onclick="closeEditModal()" class="w-full py-2 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">Cancelar</button>
          <button type="submit" class="w-full py-2 text-xs font-semibold rounded-lg bg-blue-600 hover:bg-blue-700 text-white">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://wpkbojgotrblpaggsylg.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_DpwCnnYi5nSDgBOH9Licow_iTOwy6XU";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = JSON.parse(localStorage.getItem('treasury_session') || 'null');
    let categories = { income: [], expense: [] };
    let currentTransactions = [];
    
    // Instancias de Chart.js
    let donutChartInstance = null;
    let categoriesChartInstance = null;

    if (currentUser) {
      startApp();
    }

    // LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value.trim();

      const { data } = await sb.from('app_users').select('*').eq('username', u).eq('password', p).single();

      if (data) {
        currentUser = data;
        localStorage.setItem('treasury_session', JSON.stringify(data));
        document.getElementById('loginError').classList.add('hidden');
        startApp();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    });

    function logout() {
      localStorage.removeItem('treasury_session');
      location.reload();
    }

    async function startApp() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('appView').classList.remove('hidden');
      
      const badge = document.getElementById('userBadge');
      badge.textContent = `👤 ${currentUser.username} (${currentUser.role === 'admin' ? 'Administrador' : 'Usuario'})`;

      const adminNav = document.getElementById('adminNav');
      const sectionRegister = document.getElementById('sectionRegister');

      if (currentUser.role === 'admin') {
        adminNav.style.display = 'grid';
        loadUsersList();
      } else {
        adminNav.style.display = 'none';
        sectionRegister.style.display = 'none';
      }

      switchTab('reports');
      await loadCategories();
      populateFilterCategories();
      loadReports();
    }

    function switchTab(tab) {
      if (currentUser.role !== 'admin' && tab === 'register') {
        tab = 'reports';
      }

      const repSec = document.getElementById('sectionReports');
      const regSec = document.getElementById('sectionRegister');
      const repBtn = document.getElementById('tabReportsBtn');
      const regBtn = document.getElementById('tabRegisterBtn');

      if (tab === 'reports') {
        repSec.style.display = 'block';
        regSec.style.display = 'none';
        repBtn.className = "py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition";
        regBtn.className = "py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
        loadReports();
      } else {
        repSec.style.display = 'none';
        regSec.style.display = 'block';
        regBtn.className = "py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition";
        repBtn.className = "py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
      }
    }

    // CATEGORÍAS
    async function loadCategories() {
      const { data } = await sb.from('categories').select('*');
      if (data && data.length > 0) {
        categories.income = data.filter(c => c.type === 'income').map(c => c.name);
        categories.expense = data.filter(c => c.type === 'expense').map(c => c.name);
      } else {
        categories.income = ['Diezmo', 'Ofrenda', 'Pacto', 'Pro-Templo', 'Otro'];
        categories.expense = ['Alquiler', 'Luz / Servicios', 'Mantenimiento', 'Honorarios', 'Otro'];
      }
      updateFormCategories();
    }

    function updateFormCategories() {
      const checkedRadio = document.querySelector('input[name="txType"]:checked');
      if (!checkedRadio) return;
      const type = checkedRadio.value;
      const select = document.getElementById('txCategory');
      select.innerHTML = '';
      (categories[type] || []).forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function onFlowTypeChange() {
      populateFilterCategories();
      loadReports();
    }

    function populateFilterCategories() {
      const flow = document.getElementById('filterFlowType').value;
      const catSelect = document.getElementById('filterCategory');
      catSelect.innerHTML = '<option value="all">Todos los motivos</option>';

      let list = [];
      if (flow === 'all') {
        list = Array.from(new Set([...categories.income, ...categories.expense]));
      } else {
        list = categories[flow] || [];
      }

      list.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        catSelect.appendChild(opt);
      });
    }

    async function promptNewCategory() {
      if (currentUser.role !== 'admin') return;
      const type = document.querySelector('input[name="txType"]:checked').value;
      const val = prompt(`Nuevo motivo para ${type === 'income' ? 'Ingreso' : 'Egreso'}:`);
      if (val && val.trim()) {
        const clean = val.trim();
        await sb.from('categories').insert([{ type, name: clean }]);
        categories[type].push(clean);
        updateFormCategories();
        populateFilterCategories();
        document.getElementById('txCategory').value = clean;
      }
    }

    // REGISTRAR MOVIMIENTO
    document.getElementById('txForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (currentUser.role !== 'admin') return;

      const btn = document.getElementById('saveTxBtn');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      const type = document.querySelector('input[name="txType"]:checked').value;
      const amount = parseFloat(document.getElementById('txAmount').value);
      const category = document.getElementById('txCategory').value;
      const description = document.getElementById('txDesc').value;

      const { error } = await sb.from('transactions').insert([{
        type,
        amount,
        category,
        description,
        transacted_at: new Date().toISOString(),
        created_by: currentUser.username
      }]);

      btn.disabled = false;
      btn.textContent = 'Guardar Movimiento';

      if (!error) {
        document.getElementById('txAmount').value = '';
        document.getElementById('txDesc').value = '';
        alert('✅ Movimiento registrado correctamente');
        switchTab('reports');
      } else {
        alert('Error: ' + error.message);
      }
    });

    // REPORTES, BALANCES Y GRÁFICOS
    async function loadReports() {
      const startDate = document.getElementById('filterStartDate').value;
      const endDate = document.getElementById('filterEndDate').value;
      const flowType = document.getElementById('filterFlowType').value;
      const category = document.getElementById('filterCategory').value;
      const list = document.getElementById('txList');
      list.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Cargando...</p>';

      let query = sb.from('transactions').select('*').order('transacted_at', { ascending: false });

      if (flowType !== 'all') {
        query = query.eq('type', flowType);
      }

      if (category !== 'all') {
        query = query.eq('category', category);
      }

      if (startDate) {
        query = query.gte('transacted_at', new Date(startDate + 'T00:00:00').toISOString());
      }
      if (endDate) {
        query = query.lte('transacted_at', new Date(endDate + 'T23:59:59').toISOString());
      }

      const { data } = await query;
      currentTransactions = data || [];

      if (!data || data.length === 0) {
        list.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No se encontraron movimientos.</p>';
        document.getElementById('metricIncome').textContent = '$0';
        document.getElementById('metricExpense').textContent = '$0';
        document.getElementById('metricBalance').textContent = '$0';
        renderCharts(0, 0, {});
        return;
      }

      let totalIn = 0;
      let totalOut = 0;
      let categoryTotals = {};
      list.innerHTML = '';

      data.forEach(item => {
        const isIncome = item.type === 'income';
        const num = Number(item.amount);
        if (isIncome) totalIn += num;
        else totalOut += num;

        // Sumar para gráfico por categoría
        categoryTotals[item.category] = (categoryTotals[item.category] || 0) + num;

        const d = new Date(item.transacted_at);
        const fechaHora = d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const isAdmin = currentUser.role === 'admin';
        const actionsHtml = isAdmin ? `
          <div class="flex items-center gap-2 mt-2 pt-2 border-t border-slate-100 justify-end">
            <button onclick="openEditModal(${item.id})" class="text-[11px] font-semibold text-blue-600 hover:underline">Editar</button>
            <span class="text-slate-200">|</span>
            <button onclick="deleteTransaction(${item.id})" class="text-[11px] font-semibold text-rose-500 hover:underline">Eliminar</button>
          </div>
        ` : '';

        const card = document.createElement('div');
        card.className = 'bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm text-sm';
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <div class="font-bold text-slate-800">${item.category}</div>
              <div class="text-[11px] text-slate-400">${fechaHora} ${item.description ? '· ' + item.description : ''}</div>
            </div>
            <div class="font-bold text-base ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
              ${isIncome ? '+' : '-'}$${num.toLocaleString('es-AR')}
            </div>
          </div>
          ${actionsHtml}
        `;
        list.appendChild(card);
      });

      document.getElementById('metricIncome').textContent = `$${totalIn.toLocaleString('es-AR')}`;
      document.getElementById('metricExpense').textContent = `$${totalOut.toLocaleString('es-AR')}`;
      const balance = totalIn - totalOut;
      const bElem = document.getElementById('metricBalance');
      bElem.textContent = `$${balance.toLocaleString('es-AR')}`;
      bElem.className = `text-sm font-bold ${balance >= 0 ? 'text-blue-600' : 'text-rose-600'}`;

      renderCharts(totalIn, totalOut, categoryTotals);
    }

    // RENDERIZADO DE GRÁFICOS (CHART.JS)
    function renderCharts(income, expense, catTotals) {
      // 1. Gráfico de Donut: Ingresos vs Egresos
      const ctxDonut = document.getElementById('chartDonut').getContext('2d');
      if (donutChartInstance) donutChartInstance.destroy();

      donutChartInstance = new Chart(ctxDonut, {
        type: 'doughnut',
        data: {
          labels: ['Ingresos', 'Egresos'],
          datasets: [{
            data: [income, expense],
            backgroundColor: ['#10b981', '#f43f5e'],
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
          }
        }
      });

      // 2. Gráfico de Barras: Distribución por Motivos
      const ctxBar = document.getElementById('chartCategories').getContext('2d');
      if (categoriesChartInstance) categoriesChartInstance.destroy();

      const sortedCategories = Object.keys(catTotals).sort((a, b) => catTotals[b] - catTotals[a]);
      const catData = sortedCategories.map(c => catTotals[c]);

      categoriesChartInstance = new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels: sortedCategories,
          datasets: [{
            label: 'Monto ($)',
            data: catData,
            backgroundColor: '#3b82f6',
            borderRadius: 6
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            x: { ticks: { font: { size: 10 } } },
            y: { ticks: { font: { size: 10 } } }
          }
        }
      });
    }

    // EXPORTAR A EXCEL (.XLSX)
    function exportToExcel() {
      if (!currentTransactions || currentTransactions.length === 0) {
        alert('No hay movimientos cargados para exportar con los filtros actuales.');
        return;
      }

      const rows = currentTransactions.map(item => {
        const d = new Date(item.transacted_at);
        return {
          'Fecha': d.toLocaleDateString('es-AR'),
          'Hora': d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          'Tipo': item.type === 'income' ? 'Ingreso' : 'Egreso',
          'Motivo': item.category,
          'Monto ($)': Number(item.amount),
          'Descripción': item.description || '',
          'Registrado por': item.created_by || ''
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(rows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Tesorería');

      // Descargar con nombre formateado
      const today = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(workbook, `Tesoreria_Reporte_${today}.xlsx`);
    }

    function clearFilters() {
      document.getElementById('filterStartDate').value = '';
      document.getElementById('filterEndDate').value = '';
      document.getElementById('filterFlowType').value = 'all';
      populateFilterCategories();
      loadReports();
    }

    // ELIMINAR MOVIMIENTO (Solo Admin)
    async function deleteTransaction(id) {
      if (currentUser.role !== 'admin') return;
      if (!confirm('¿Estás seguro de eliminar este movimiento?')) return;
      const { error } = await sb.from('transactions').delete().eq('id', id);
      if (!error) {
        loadReports();
      } else {
        alert('Error al eliminar: ' + error.message);
      }
    }

    // EDITAR MOVIMIENTO (Solo Admin)
    function openEditModal(id) {
      if (currentUser.role !== 'admin') return;
      const item = currentTransactions.find(t => t.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('editType').value = item.type;
      document.getElementById('editAmount').value = item.amount;
      document.getElementById('editDesc').value = item.description || '';
      
      const dateStr = new Date(item.transacted_at).toISOString().split('T')[0];
      document.getElementById('editDate').value = dateStr;

      updateEditCategories();
      document.getElementById('editCategory').value = item.category;

      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function updateEditCategories() {
      const type = document.getElementById('editType').value;
      const sel = document.getElementById('editCategory');
      sel.innerHTML = '';
      (categories[type] || []).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
      });
    }

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (currentUser.role !== 'admin') return;

      const id = document.getElementById('editId').value;
      const type = document.getElementById('editType').value;
      const amount = parseFloat(document.getElementById('editAmount').value);
      const category = document.getElementById('editCategory').value;
      const description = document.getElementById('editDesc').value;
      const dateVal = document.getElementById('editDate').value;

      const dateObj = new Date(dateVal + 'T12:00:00').toISOString();

      const { error } = await sb.from('transactions').update({
        type,
        amount,
        category,
        description,
        transacted_at: dateObj
      }).eq('id', id);

      if (!error) {
        closeEditModal();
        loadReports();
      } else {
        alert('Error al actualizar: ' + error.message);
      }
    });

    // ABM USUARIOS (Solo Admin)
    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (currentUser.role !== 'admin') return;

      const username = document.getElementById('newUsername').value.trim();
      const password = document.getElementById('newPassword').value.trim();
      const role = document.getElementById('newRole').value;

      const { error } = await sb.from('app_users').insert([{ username, password, role }]);
      if (!error) {
        document.getElementById('newUsername').value = '';
        document.getElementById('newPassword').value = '';
        alert('Usuario creado con éxito');
        loadUsersList();
      } else {
        alert('Error: ' + error.message);
      }
    });

    async function loadUsersList() {
      if (currentUser.role !== 'admin') return;
      const container = document.getElementById('usersList');
      const { data } = await sb.from('app_users').select('id, username, role');
      if (data) {
        container.innerHTML = data.map(u => `
          <div class="flex justify-between items-center py-1.5 border-b border-slate-100">
            <span><b>${u.username}</b> (${u.role})</span>
            ${u.username !== 'admin' ? `<button onclick="deleteUser(${u.id})" class="text-rose-500 font-bold hover:underline">Eliminar</button>` : ''}
          </div>
        `).join('');
      }
    }

    async function deleteUser(id) {
      if (currentUser.role !== 'admin') return;
      if (confirm('¿Eliminar este usuario?')) {
        await sb.from('app_users').delete().eq('id', id);
        loadUsersList();
      }
    }
  </script>
</body>
</html>
